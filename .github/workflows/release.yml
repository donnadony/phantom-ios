name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          VERSION=""
          if echo "$MESSAGE" | grep -qE '^\[release\]'; then
            VERSION=$(echo "$MESSAGE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi
          if [ -z "$VERSION" ]; then
            LATEST_TAG=$(git tag --sort=-v:refname | head -1)
            LATEST_TAG=${LATEST_TAG:-0.0.0}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.skip == 'false'
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            LOG=$(git log --oneline)
          else
            LOG=$(git log --oneline "$PREVIOUS_TAG"..HEAD)
          fi
          {
            echo "notes<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Phantom iOS ${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            --target "$GITHUB_SHA"
